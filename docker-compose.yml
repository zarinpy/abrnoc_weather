version: '3.8'
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - OPENWEATHER_API_KEY=your_key
      - JWT_SECRET=supersecret
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: abrnoc_weather
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: